spring.application.name=message-simulator

# Database Properties (Postgres)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:simulator}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,filesystem:../../database/migrations

# ActiveMQ Artemis (Emulating TIBCO EMS for some workloads where possible)
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.queues=simulator.in.queue,simulator.out.queue
spring.artemis.embedded.topics=simulator.topic

# Observability / Management
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# OpenTelemetry Tracing
management.tracing.sampling.probability=1.0
