apiVersion: v1
kind: Service
metadata:
  name: {{ include "message-simulator.fullname" . }}-frontend
  labels:
    {{- include "message-simulator.labels" . | nindent 4 }}
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "message-simulator.selectorLabels" . | nindent 4 }}
    component: frontend
